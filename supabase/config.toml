# Razorpay order creation — requires a logged-in user (JWT verified by platform).
[functions.razorpay-create-order]
verify_jwt = true

# Razorpay signature verification — called by Checkout for the signed-in buyer.
[functions.razorpay-verify]
verify_jwt = true

# Razorpay's server-to-server recovery path for payment.captured/order.paid.
# The function verifies x-razorpay-signature itself using RAZORPAY_WEBHOOK_SECRET.
[functions.razorpay-webhook]
verify_jwt = false
